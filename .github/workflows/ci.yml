name: Go CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format validation
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$files" || { echo "$files"; exit 1; }
      - name: Unit tests
        run: go test ./...
      - name: Static checks
        run: go vet ./...
