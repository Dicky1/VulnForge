<svg width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VulnForge logo" xmlns:c2pa="http://c2pa.org/manifest">
  <title>VulnForge</title>
  <defs>
    <linearGradient id="vf-flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4d2e"/>
      <stop offset="55%" stop-color="#ff8a1e"/>
      <stop offset="100%" stop-color="#ffc94d"/>
    </linearGradient>
    <linearGradient id="vf-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4552"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
    <linearGradient id="vf-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <!-- Mark: anvil base + shield + flame, inside a rounded badge -->
  <g transform="translate(14,14)">
    <rect x="0" y="0" width="132" height="132" rx="26" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

    <!-- Anvil -->
    <g transform="translate(20,64)">
      <path d="M6 44 L86 44 L86 54 L6 54 Z" fill="url(#vf-steel)"/>
      <path d="M14 20 Q14 10 26 10 L70 10 Q82 10 82 20 L82 32 Q82 40 72 40 L24 40 Q14 40 14 32 Z" fill="url(#vf-steel)"/>
      <rect x="40" y="40" width="14" height="10" fill="#1c2128"/>
      <rect x="4" y="52" width="88" height="8" rx="2" fill="#11161c"/>
    </g>

    <!-- Shield overlay, upper-right of the anvil -->
    <path d="M78 14 L104 22 L104 46 Q104 66 78 78 Q52 66 52 46 L52 22 Z"
          fill="url(#vf-shield)" stroke="#0d1117" stroke-width="3"/>
    <path d="M78 26 L68 48 L76 48 L72 64 L92 40 L82 40 L88 26 Z" fill="#0d1117"/>

    <!-- Flame accent, struck from the anvil -->
    <path d="M26 58 Q14 46 22 32 Q25 44 32 40 Q28 28 38 18 Q34 36 44 34 Q46 20 58 14
             Q48 30 56 36 Q64 30 66 22 Q70 36 62 48 Q54 60 38 60 Q30 60 26 58 Z"
          fill="url(#vf-flame)" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(166,0)">
    <text x="0" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#e6edf3">Vuln<tspan fill="#ff8a1e">Forge</tspan></text>
    <text x="2" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.5" fill="#8b949e">AI-Assisted SAST · DAST · Black-Box Security Testing</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
