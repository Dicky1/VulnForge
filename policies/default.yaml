policy:
  name: Default Security Policy
  version: "1.0"
  rules:
    - name: hardcoded-secrets
      type: cwe
      cwe: 798
      enabled: true
      severity: critical
      remediation: Rotate the credential and use a managed secret store.
    - name: injection
      type: cwe
      cwe: 89
      enabled: true
      severity: critical
filtering:
  exclude_paths: [vendor/, node_modules/, .git/, testdata/]
  exclude_cwe: []
  minimum_confidence: 0.75
  minimum_severity: medium
compliance:
  frameworks: [owasp-top-10, cwe-top-25]
