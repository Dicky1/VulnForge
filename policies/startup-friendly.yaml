policy:
  name: Startup Friendly Security Baseline
  version: "1.0"
  rules:
    - {name: exposed-credentials, type: cwe, cwe: 798, enabled: true, severity: critical}
    - {name: injection, type: cwe, cwe: 89, enabled: true, severity: critical}
filtering:
  exclude_paths: [vendor/, node_modules/, .git/, testdata/, examples/]
  minimum_confidence: 0.75
  minimum_severity: high
compliance: {frameworks: [owasp-top-10]}
